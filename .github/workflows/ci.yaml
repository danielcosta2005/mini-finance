name: MiniFinance CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Backend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: V8 coverage
        run: npm run test:coverage
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-quality-${{ matrix.os }}
          path: |
            backend/test-reports/*.xml
            backend/coverage/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Backend HTTP integration (Linux containers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify Linux Docker runtime
        run: docker info --format '{{.OSType}}'
      - name: Run HTTP tests with Testcontainers-managed Compose
        run: npm run test:integration
      - name: Show service logs on failure
        if: failure()
        run: node -e "const fs=require('node:fs');const p='test-reports/containers.log';if(fs.existsSync(p))process.stdout.write(fs.readFileSync(p,'utf8'))"
      - name: Upload integration reports and container diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-integration-ubuntu
          path: backend/test-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend-quality:
    name: Frontend quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage-${{ matrix.os }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e:
    name: Frontend E2E with real backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-playwright-ubuntu
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
