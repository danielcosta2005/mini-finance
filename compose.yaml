name: minifinance-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://minifinance:local-only-placeholder@postgres:5432/minifinance}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:3000}
      DEV_SERVER_PORT: "5173"
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minifinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-minifinance}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
