name: minifinance-dev

services:
  api:
    build:
      context: .
      target: development
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Copie .env.example para .env e defina DOCKER_DATABASE_URL}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minifinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_DB: ${POSTGRES_DB:-minifinance}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
